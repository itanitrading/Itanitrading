<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ItaniTrading Admin</title>

<style>
body{font-family:Arial;margin:0;background:#f3f4f6;color:#111827}
.wrap{max-width:1100px;margin:auto;padding:20px}
.box{background:white;padding:18px;border-radius:14px;margin-bottom:18px;box-shadow:0 2px 8px #0001}
input,button,textarea{padding:10px;border-radius:8px;border:1px solid #ddd;margin:4px}
button{cursor:pointer}
.primary{background:#111827;color:white}
.green{background:#25D366;color:white}
.red{background:#ef4444;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.product{border:1px solid #ddd;padding:12px;border-radius:10px}
.product img{width:100%;height:140px;object-fit:cover;border-radius:8px}
.order{border:1px solid #ddd;padding:12px;border-radius:10px;margin:10px 0}
.status{font-weight:bold;margin:8px 0}
</style>
</head>

<body>

<div class="wrap">

<div id="login" class="box">
<h1>🔐 ItaniTrading Admin</h1>
<p>This page is private.</p>

<input id="password" type="password" placeholder="Admin password">
<button type="button" class="primary" id="loginButton">Login</button>
  

<p id="loginMsg"></p>
</div>


<div id="app" style="display:none">

<div class="box">
<button class="red" onclick="logout()">Logout</button>
<h1>📦 ItaniTrading Admin Dashboard</h1>
<p>Manage products and view customer orders.</p>
</div>


<div class="box">
<h2>➕ Add Product</h2>

<form id="form" enctype="multipart/form-data">

<input name="name" placeholder="Product name" required>

<input
name="price"
type="number"
step="0.01"
placeholder="Price"
required>

<label>
<br>
Product picture:
<br>
<input
name="image"
type="url"
open gallery
placeholder=choose from gallery image URL">
</label>

<br>

<label>
<input
name="available"
type="checkbox"
checked>
Available
</label>

<br>

<button class="green" type="submit">
Add Product
</button>

</form>
</div>


<div class="box">
<h2>🛒 Products</h2>
<div id="products" class="grid"></div>
</div>


<div class="box">
<h2>🔔 Customer Orders</h2>
<div id="orders"></div>
</div>

</div>
</div>


<script>

let token = localStorage.getItem("itanitrading_admin_token");

async function check() {
    try {
        const r = await fetch("/api/admin/me", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        if (r.ok) {
            const x = await r.json();

            if (x.loggedIn) {
                document.getElementById("login").style.display = "none";
                document.getElementById("app").style.display = "block";

                loadProducts();
                loadOrders();
                return;
            }
        }

        localStorage.removeItem("itanitrading_admin_token");

        document.getElementById("login").style.display = "block";
        document.getElementById("app").style.display = "none";

    } catch (e) {
        document.getElementById("loginMsg").textContent =
            "Server connection error.";
    }
}


async function login() {

    const password =
        document.getElementById("password").value;

    const msg =
        document.getElementById("loginMsg");

    msg.textContent = "Logging in...";

    try {

        const r = await fetch("/api/admin/login", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                password: password
            })
        });

        const x = await r.json();

        if (!r.ok) {
            msg.textContent =
                x.error || "Login failed.";
            return;
        }

        localStorage.setItem(
            "itanitrading_admin_token",
            x.token
        );

        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "block";

        token = x.token;

        loadProducts();
        loadOrders();

    } catch (e) {

        msg.textContent =
            "Server connection error.";
    }
}


async function logout() {

    try {

        await fetch("/api/admin/logout", {
            method: "POST",

            headers: {
                "Authorization": "Bearer " + token
            }
        });

    } catch (e) {}

    localStorage.removeItem(
        "itanitrading_admin_token"
    );

    location.reload();
}


/* ================= PRODUCTS ================= */

async function loadProducts() {

    try {

        const r = await fetch("/api/products");

        const ps = await r.json();

        const container =
            document.getElementById("products");

        if (!ps.length) {

            container.innerHTML =
                "<p>No products yet.</p>";

            return;
        }

        container.innerHTML = ps.map(p => `

            <div class="product">

                ${
                    p.image
                    ?
                    `<img src="${p.image}" alt="${esc(p.name)}">`
                    :
                    `<div style="
                        height:140px;
                        background:#eee;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        border-radius:8px;
                    ">
                        No picture
                    </div>`
                }

                <br>

                <b>${esc(p.name)}</b>

                <p>
                    Price:
                    $
                    <input
                        style="width:80px"
                        id="price-${p.id}"
                        value="${p.price}"
                    >
                </p>

                <p class="status">
                    ${
                        p.available
                        ? "🟢 Available"
                        : "🔴 Sold Out"
                    }
                </p>

                <button
                    class="green"
                    onclick="save('${p.id}')">
                    Save Price
                </button>

                <button
                    onclick="toggle('${p.id}', ${p.available})">
                    ${
                        p.available
                        ? "🔴 Mark Sold Out"
                        : "🟢 Mark Available"
                    }
                </button>

                <button
                    class="red"
                    onclick="del('${p.id}')">
                    🗑️ Delete
                </button>

            </div>

        `).join("");

    } catch (e) {

        document.getElementById("products").innerHTML =
            "<p>Could not load products.</p>";
    }
}


/* ================= SAVE PRICE ================= */

async function save(id) {

    const price =
        document.getElementById("price-" + id).value;

    const r = await fetch("/api/products/" + id, {

        method: "PATCH",

        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },

        body: JSON.stringify({
            price: Number(price)
        })
    });

    if (!r.ok) {

        alert("Could not save the price.");
        return;
    }

    loadProducts();
}


/* ================= AVAILABLE / SOLD OUT ================= */

async function toggle(id, status) {

    const r = await fetch("/api/products/" + id, {

        method: "PATCH",

        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },

        body: JSON.stringify({
            available: !status
        })
    });

    if (!r.ok) {

        alert("Could not change product availability.");
        return;
    }

    loadProducts();
}


/* ================= DELETE ================= */

async function del(id) {

    if (!confirm("Delete this product?")) {
        return;
    }

    const r = await fetch("/api/products/" + id, {

        method: "DELETE",

        headers: {
            "Authorization": "Bearer " + token
        }
    });

    if (!r.ok) {

        alert("Could not delete product.");
        return;
    }

    loadProducts();
}


/* ================= ADD PRODUCT ================= */

document.getElementById("form").onsubmit = async e => {

    e.preventDefault();

    const fd = new FormData(e.target);

    fd.set(
        "available",
        e.target.available.checked
            ? "true"
            : "false"
    );

    const r = await fetch("/api/products", {

        method: "POST",

        headers: {
            "Authorization": "Bearer " + token
        },

        body: fd
    });

    if (!r.ok) {

        const error =
            await r.json().catch(() => ({}));

        alert(
            error.error ||
            "Could not add product."
        );

        return;
    }

    e.target.reset();

    e.target.available.checked = true;

    loadProducts();
};


/* ================= ORDERS ================= */

async function loadOrders() {

    try {

        const r = await fetch("/api/orders", {

            headers: {
                "Authorization": "Bearer " + token
            }
        });

        if (!r.ok) {
            return;
        }

        const os = await r.json();

        document.getElementById("orders").innerHTML =

            os.length

            ?

            os.map(o => `

                <div class="order">

                    <b>
                        👤 ${esc(o.customer)}
                    </b>

                    — ${esc(o.phone || "")}

                    <br>

                    <small>
                        ${new Date(o.createdAt).toLocaleString()}
                    </small>

                    <ul>

                        ${
                            (o.items || o.products || [])
                            .map(p => `

                                <li>

                                    ${esc(p.name)}

                                    x${p.quantity}

                                    —

                                    $${(
                                        Number(p.price) *
                                        Number(p.quantity)
                                    ).toFixed(2)}

                                </li>

                            `).join("")
                        }

                    </ul>

                    <b>
                        Total:
                        $${Number(o.total).toFixed(2)}
                    </b>

                    <p>
                        📝
                        ${esc(o.notes || "No notes")}
                    </p>

                </div>

            `).join("")

            :

            "No orders yet.";

    } catch (e) {}
}


/* ================= SECURITY ================= */

function esc(s) {

    return String(s).replace(
        /[&<>"']/g,

        m => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[m])
    );
}


/* ================= START ================= */

document.getElementById("loginButton").onclick = login;

check();

setInterval(loadOrders, 10000);

</script>
