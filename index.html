<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#25D366"><link rel="manifest" href="/manifest.json"><title>ItaniTrading</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7f8;color:#111827}
header{background:#111827;color:white;padding:16px;position:sticky;top:0;z-index:5}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:800}.cartbtn{background:#25D366;border:0;color:white;padding:11px 15px;border-radius:10px;font-weight:700}
main{max-width:1100px;margin:20px auto;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px}
.card{background:white;border-radius:14px;padding:12px;box-shadow:0 2px 10px #00000012}.pic{width:100%;height:160px;object-fit:cover;border-radius:10px;background:#eee}
.price{font-size:20px;font-weight:800;margin:8px 0}.sold{color:#6b7280;font-weight:700}.add{width:100%;border:0;background:#111827;color:white;padding:10px;border-radius:9px;font-weight:700}.add:disabled{background:#aaa}
.cart{position:fixed;right:0;top:0;width:min(420px,100%);height:100%;background:white;z-index:20;box-shadow:-5px 0 20px #0003;padding:20px;overflow:auto;transform:translateX(100%);transition:.2s}.cart.open{transform:translateX(0)}
input,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 10px}.close{float:right;border:0;background:#eee;border-radius:8px;padding:8px}.checkout{background:#25D366;color:white;border:0;width:100%;padding:13px;border-radius:10px;font-weight:800}
.qty button{padding:3px 9px;border:1px solid #ddd;background:#fff;border-radius:5px}
</style></head><body>
<header><div class="head"><div class="logo">ItaniTrading</div><button class="cartbtn" onclick="toggleCart()">🛒 Cart (<span id="count">0</span>)</button></div></header>
<main><h1>Order from ItaniTrading</h1><p>Choose your products and send your order.</p><div id="products" class="grid"></div></main>
<aside id="cart" class="cart"><button class="close" onclick="toggleCart()">✕</button><h2>Your Order</h2><div id="cartItems"></div><h3>Total: $<span id="total">0.00</span></h3>
<input id="customer" placeholder="Your name"><input id="phone" placeholder="Phone number"><textarea id="notes" placeholder="Notes (optional)"></textarea>
<button class="checkout" onclick="placeOrder()">📲 Place Order on WhatsApp</button><p id="status"></p></aside>
<script>

let products = [];
let cart = [];

async function load() {
    try {
        const r = await fetch("/api/products");
        products = await r.json();
        render();
    } catch (e) {
        document.getElementById("products").innerHTML =
            "<p>Could not load products.</p>";
    }
}


function render() {

    document.getElementById("products").innerHTML =
        products.map(p => `

            <div class="card">

                ${
                    p.image
                    ?
                    `<img class="pic"
                         src="${p.image}"
                         alt="${esc(p.name)}">`
                    :
                    `<div class="pic"
                         style="display:flex;
                                align-items:center;
                                justify-content:center;">
                        No image
                    </div>`
                }

                <h3>${esc(p.name)}</h3>

                <div class="price">
                    $${Number(p.price).toFixed(2)}
                </div>

                ${
                    p.available
                    ?
                    `<button
                        class="add"
                        onclick="add('${p.id}')">
                        Add to Order
                    </button>`
                    :
                    `<div class="sold">
                        🔴 Sold Out
                    </div>`
                }

            </div>

        `).join("");

    renderCart();
}


function add(id) {

    const p = products.find(x => String(x.id) === String(id));

    if (!p || !p.available) return;

    const x = cart.find(
        x => String(x.id) === String(id)
    );

    if (x) {
        x.quantity++;
    } else {
        cart.push({
            ...p,
            quantity: 1
        });
    }

    renderCart();
    toggleCart();
}


function change(id, d) {

    const x = cart.find(
        x => String(x.id) === String(id)
    );

    if (!x) return;

    x.quantity += d;

    if (x.quantity <= 0) {
        cart = cart.filter(
            x => String(x.id) !== String(id)
        );
    }

    renderCart();
}


function renderCart() {

    const count =
        cart.reduce(
            (s, x) => s + x.quantity,
            0
        );

    document.getElementById("count").textContent =
        count;


    const total =
        cart.reduce(
            (s, x) =>
                s + Number(x.price) * x.quantity,
            0
        );

    document.getElementById("total").textContent =
        total.toFixed(2);


    document.getElementById("cartItems").innerHTML =
        cart.length

        ?

        cart.map(x => `

            <div style="
                padding:10px 0;
                border-bottom:1px solid #eee
            ">

                <b>${esc(x.name)}</b>

                <div class="qty">

                    <button
                        onclick="change('${x.id}',-1)">
                        −
                    </button>

                    ${x.quantity}

                    <button
                        onclick="change('${x.id}',1)">
                        +
                    </button>

                    —
                    $${(
                        Number(x.price) *
                        x.quantity
                    ).toFixed(2)}

                </div>

            </div>

        `).join("")

        :

        "Your cart is empty.";
}


function toggleCart() {

    document
        .getElementById("cart")
        .classList
        .toggle("open");
}


async function placeOrder() {

    if (!cart.length) {
        alert("Add products first.");
        return;
    }


    const customer =
        document
            .getElementById("customer")
            .value
            .trim();

    const phone =
        document
            .getElementById("phone")
            .value
            .trim();

    const notes =
        document
            .getElementById("notes")
            .value
            .trim();


    if (!customer || !phone) {

        alert(
            "Please enter your name and phone number."
        );

        return;
    }


    const total =
        cart.reduce(
            (s, x) =>
                s +
                Number(x.price) *
                x.quantity,
            0
        );


    try {

        const r = await fetch("/api/orders", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                customer: customer,

                phone: phone,

                products: cart.map(x => ({

                    name: x.name,

                    quantity: x.quantity,

                    price: Number(x.price)

                })),

                total: total,

                notes: notes

            })

        });


        const data = await r.json();


        if (!r.ok) {

            alert(
                data.error ||
                "Could not place order."
            );

            return;
        }


        const msg =
            `📦 *New Order - ItaniTrading*%0A%0A` +

            `👤 *Customer:* ` +
            encodeURIComponent(customer) +

            `%0A📞 *Phone:* ` +
            encodeURIComponent(phone) +

            `%0A%0A*Products:*%0A` +

            cart.map(x =>
                `• ${encodeURIComponent(x.name)} ` +
                `x${x.quantity} - $` +
                (
                    Number(x.price) *
                    x.quantity
                ).toFixed(2)
            ).join("%0A") +

            `%0A%0A💰 *Total:* $` +
            total.toFixed(2) +

            (
                notes
                ?
                `%0A📝 *Notes:* ` +
                encodeURIComponent(notes)
                :
                ""
            );


        if (data.whatsappNumber) {

            window.open(
                `https://wa.me/${data.whatsappNumber}?text=${msg}`,
                "_blank"
            );

        }


        cart = [];

        renderCart();

        document.getElementById("status").textContent =
            "Order saved successfully.";


    } catch (e) {

        alert(
            "Could not connect to the server."
        );
    }
}


function esc(s) {

    return String(s).replace(
        /[&<>"']/g,

        m => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[m])
    );
}


load();

</script>
