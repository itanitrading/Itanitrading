                                                      <!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#25D366">

<link rel="manifest" href="/manifest.json">

<title>ItaniTrading</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7f8;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 15px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.header {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.cart-button {
    background: #25D366;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}

main {
    max-width: 1100px;
    margin: 20px auto;
    padding: 0 15px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 15px;
}

.product {
    background: white;
    padding: 12px;
    border-radius: 14px;
    box-shadow: 0 2px 10px #00000015;
}

.product-image {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 10px;
    background: #eee;
}

.product h3 {
    margin: 10px 0 5px;
}

.price {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
}

.add-button {
    width: 100%;
    background: #111827;
    color: white;
    border: none;
    padding: 11px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}

.sold {
    color: #777;
    font-weight: bold;
    padding: 10px 0;
}

.cart {
    position: fixed;
    right: 0;
    top: 0;
    width: min(420px, 100%);
    height: 100%;
    background: white;
    z-index: 50;
    padding: 20px;
    overflow-y: auto;
    box-shadow: -5px 0 20px #0003;

    transform: translateX(100%);
    transition: transform 0.2s;
}

.cart.open {
    transform: translateX(0);
}

.close {
    float: right;
    border: none;
    background: #eee;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.cart-item {
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

.quantity button {
    padding: 3px 9px;
    margin: 5px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 5px;
}

input,
textarea {
    width: 100%;
    padding: 11px;
    margin: 5px 0 10px;
    border: 1px solid #ddd;
    border-radius: 9px;
}

.continue {
    width: 100%;
    background: #111827;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 9px;
    font-weight: bold;
    margin: 8px 0;
    cursor: pointer;
}

.whatsapp {
    width: 100%;
    background: #25D366;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}
</style>

</head>

<body>

<header>

<div class="header">

<div class="logo">
ItaniTrading
</div>

<button class="cart-button" onclick="toggleCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>

</div>

</header>


<main>

<h1>Order from ItaniTrading</h1>

<p>Choose your products and send your order.</p>

<div id="products" class="products">
Loading products...
</div>

</main>


<div id="cart" class="cart">

<button class="close" onclick="closeCart()">
✕
</button>

<h2>Your Order</h2>

<div id="cartItems">
Your cart is empty.
</div>

<h3>
Total: $<span id="total">0.00</span>
</h3>

<input
    id="customer"
    type="text"
    placeholder="Your name">

<input
    id="phone"
    type="text"
    placeholder="Phone number">

<textarea
    id="notes"
    placeholder="Notes (optional)">
</textarea>

<button
    class="continue"
    onclick="closeCart()">

🛍️ Continue Shopping

</button>

<button
    class="whatsapp"
    onclick="placeOrder()">

📲 Place Order on WhatsApp

</button>

</div>


<script>

const WHATSAPP_NUMBER = "96181738069";

let products = [];
let cart = [];


/* LOAD PRODUCTS */

async function loadProducts() {

    const container =
        document.getElementById("products");

    try {

        const response =
            await fetch("/api/products");

        if (!response.ok) {
            throw new Error("Could not load products");
        }

        const data =
            await response.json();

        console.log("Products:", data);

        products =
            Array.isArray(data)
                ? data
                : [];

        displayProducts();

    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Could not load products.</p>";
    }
}


/* DISPLAY PRODUCTS */

function displayProducts() {

    const container =
        document.getElementById("products");

    if (products.length === 0) {

        container.innerHTML =
            "<p>No products available.</p>";

        return;
    }

    container.innerHTML =
        products.map(product => {

            const image =
                product.image
                ?
                `<img
                    class="product-image"
                    src="${product.image}"
                    alt="${escapeHTML(product.name)}">`
                :
                `<div
                    class="product-image"
                    style="
                    display:flex;
                    align-items:center;
                    justify-content:center;">
                    No image
                </div>`;

            const button =
                product.available
                ?
                `<button
                    class="add-button"
                    onclick="addToCart('${product.id}')">
                    Add to Order
                </button>`
                :
                `<div class="sold">
                    🔴 Sold Out
                </div>`;

            return `

                <div class="product">

                    ${image}

                    <h3>
                        ${escapeHTML(product.name)}
                    </h3>

                    <div class="price">
                        $${Number(product.price).toFixed(2)}
                    </div>

                    ${button}

                </div>

            `;

        }).join("");
}


/* ADD PRODUCT */

function addToCart(id) {

    const product =
        products.find(
            p => String(p.id) === String(id)
        );

    if (!product || !product.available) {
        return;
    }

    const existing =
        cart.find(
            p => String(p.id) === String(id)
        );

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({
            ...product,
            quantity: 1
        });
    }

    updateCart();

}


/* CHANGE QUANTITY */

function changeQuantity(id, amount) {

    const item =
        cart.find(
            p => String(p.id) === String(id)
        );

    if (!item) {
        return;
    }

    item.quantity += amount;

    if (item.quantity <= 0) {

        cart =
            cart.filter(
                p => String(p.id) !== String(id)
            );
    }

    updateCart();
}


/* UPDATE CART */

function updateCart() {

    const count =
        cart.reduce(
            (total, item) =>
                total + item.quantity,
            0
        );

    document.getElementById("cartCount")
        .textContent = count;


    const total =
        cart.reduce(
            (sum, item) =>
                sum +
                Number(item.price) *
                item.quantity,
            0
        );

    document.getElementById("total")
        .textContent =
        total.toFixed(2);


    const container =
        document.getElementById("cartItems");


    if (cart.length === 0) {

        container.innerHTML =
            "Your cart is empty.";

        return;
    }


    container.innerHTML =
        cart.map(item => `

            <div class="cart-item">

                <strong>
                    ${escapeHTML(item.name)}
                </strong>

                <div class="quantity">

                    <button
                        onclick="changeQuantity('${item.id}', -1)">
                        −
                    </button>

                    ${item.quantity}

                    <button
                        onclick="changeQuantity('${item.id}', 1)">
                        +
                    </button>

                    &nbsp;

                    $${(
                        Number(item.price) *
                        item.quantity
                    ).toFixed(2)}

                </div>

            </div>

        `).join("");
}


/* OPEN CART */

function toggleCart() {

    document
        .getElementById("cart")
        .classList
        .toggle("open");
}


/* CLOSE CART */

function closeCart() {

    document
        .getElementById("cart")
        .classList
        .remove("open");
}


/* PLACE ORDER */

async function placeOrder() {

    if (cart.length === 0) {

        alert("Add products first.");

        return;
    }


    const customer =
        document
        .getElementById("customer")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    const notes =
        document
        .getElementById("notes")
        .value
        .trim();


    if (!customer || !phone) {

        alert(
            "Please enter your name and phone number."
        );

        return;
    }


    const total =
        cart.reduce(
            (sum, item) =>
                sum +
                Number(item.price) *
                item.quantity,
            0
        );


    /* SAVE ORDER TO SERVER */

    try {

        const response =
            await fetch(
                "/api/orders",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        customer: customer,

                        phone: phone,

                        products:
                            cart.map(item => ({

                                name: item.name,

                                quantity:
                                    item.quantity,

                                price:
                                    Number(item.price)

                            })),

                        total: total,

                        notes: notes

                    })
                }
            );


        if (!response.ok) {

            console.warn(
                "Order could not be saved on server."
            );
        }

    } catch (error) {

        console.error(
            "Server order error:",
            error
        );
    }


    /* WHATSAPP MESSAGE */

    let message =
        "📦 *New Order - ItaniTrading*\n\n";

    message +=
        "👤 *Customer:* " +
        customer +
        "\n";

    message +=
        "📞 *Phone:* " +
        phone +
        "\n\n";

    message +=
        "*Products:*\n";


    cart.forEach(item => {

        message +=
            "• " +
            item.name +
            " x" +
            item.quantity +
            " - $" +
            (
                Number(item.price) *
                item.quantity
            ).toFixed(2) +
            "\n";

    });


    message +=
        "\n💰 *Total:* $" +
        total.toFixed(2);


    if (notes) {

        message +=
            "\n📝 *Notes:* " +
            notes;
    }


    const whatsappURL =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);


    window.open(
        whatsappURL,
        "_blank"
    );


    /* CLEAR CART */

    cart = [];

    updateCart();

}


/* ESCAPE TEXT */

function escapeHTML(text) {

    return String(text).replace(
        /[&<>"']/g,
        function(character) {

            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[character];

        }
    );
}


/* START */

loadProducts();

</script>

</body>

  </html>
